server:
  port: 8083

spring:
  application:
    name: course-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/baimaxt
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  cache:
    type: redis
    redis:
      key-prefix: "baimaxt:"
      use-key-prefix: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
