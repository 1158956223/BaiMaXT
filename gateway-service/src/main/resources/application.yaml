server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: course-service-courses
              uri: lb://course-service
              predicates:
                - Path=/api/courses/**
            - id: course-service-teachers
              uri: lb://course-service
              predicates:
                - Path=/api/teachers/**
            - id: course-service-categories
              uri: lb://course-service
              predicates:
                - Path=/api/course-categories/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                exposed-headers:
                  - Authorization
                allow-credentials: true
                max-age: 3600

auth:
  jwt:
    secret: BaiMaXT-auth-service-dev-secret-change-me-2026
